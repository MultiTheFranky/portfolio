name: Dependency auto-merge
# Approves and enables auto-merge on every Dependabot and Renovate PR, whatever
# the version bump. GitHub only merges once the required checks pass.
on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
    push:
        branches: [master]

permissions:
    contents: write
    pull-requests: write

jobs:
    automerge:
        if: >-
            github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PR_URL: ${{ github.event.pull_request.html_url }}
        steps:
            - name: Approve
              run: |
                  approved=$(gh pr view "$PR_URL" --json reviews \
                    --jq '[.reviews[] | select(.author.login == "github-actions" and .state == "APPROVED")] | length')
                  if [ "$approved" = "0" ]; then
                    gh pr review "$PR_URL" --approve --body "Dependency update: auto-approved, merges once all checks pass."
                  fi
            - name: Enable auto-merge
              run: gh pr merge "$PR_URL" --auto --squash

    # Branch protection requires PRs to be up to date with master. Renovate
    # rebases its own PRs; Dependabot only rebases on conflicts, so update its
    # branches here. Pushes made with GITHUB_TOKEN don't trigger workflows, so
    # start the PR checks explicitly afterwards.
    update-dependabot:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            actions: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Update Dependabot PRs that fell behind master
              run: |
                  gh pr list --repo "$GITHUB_REPOSITORY" --author "app/dependabot" --state open \
                    --json number,headRefName,headRefOid,autoMergeRequest \
                    --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.headRefName) \(.headRefOid)"' |
                  while read -r number branch head; do
                    behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head...$GITHUB_SHA" --jq .ahead_by)
                    [ "$behind" -gt 0 ] || continue

                    if ! gh pr update-branch "$number" --repo "$GITHUB_REPOSITORY"; then
                      echo "::warning::#$number could not be updated (conflicts?)"
                      continue
                    fi
                    # update-branch is asynchronous; wait for the new head commit
                    for _ in $(seq 1 30); do
                      new_head=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
                      [ "$new_head" != "$head" ] && break
                      sleep 2
                    done
                    gh workflow run pull-request.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                  done
