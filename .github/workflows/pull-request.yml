name: Pull Request
on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Started by dependency-automerge.yml after it updates a Dependabot branch
    workflow_dispatch:
permissions:
    contents: read
    actions: write

concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm run lint
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm run format:check
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - run: pnpm install --no-frozen-lockfile
            # Build exactly what Cloudflare Pages deploys (with the adapter)
            - name: Build with Cloudflare adapter
              run: pnpm run build
              env:
                  CI: ""
                  GITHUB_ACTIONS: ""
            - name: Build static output
              run: pnpm run build
    test:
        # Playwright has no browser builds for ubuntu-latest (26.04) yet
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                project:
                    [chromium, firefox, webkit, mobile-chrome, mobile-safari]
        name: test (${{ matrix.project }})
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - run: pnpm install --no-frozen-lockfile
            - name: Install Playwright browser
              run: |
                  case "${{ matrix.project }}" in
                    *chrome|chromium) browser=chromium ;;
                    *safari|webkit) browser=webkit ;;
                    *) browser=${{ matrix.project }} ;;
                  esac
                  pnpm exec playwright install --with-deps "$browser"
            - name: Run Playwright tests
              run: pnpm test:e2e --project=${{ matrix.project }}
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.project }}
                  path: playwright-report
                  retention-days: 7
                  if-no-files-found: warn
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm run typecheck
    # Single stable check to mark as required in branch protection, so the
    # matrix can change without touching the repository settings
    ci-passed:
        if: always()
        needs: [lint, format, build, test, typecheck]
        runs-on: ubuntu-latest
        steps:
            - name: Fail if any job failed or was cancelled
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
              run: exit 1
            - run: echo "All checks passed"
